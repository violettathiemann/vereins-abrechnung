function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function verifyCentral(test,tries=6){
  for(let i=0;i<tries;i++){
    await wait(i===0?700:500);
    const central=await fetchCentralAppData();
    if(central && test(central))return central;
  }
  return null;
}
async function saveVerified(test){
  showSyncStatus('⏳ Wird gespeichert …','saving',true);
  const ok=await pushAppDataToSheet();
  if(!ok){showSyncStatus('⚠️ Nicht gespeichert – bitte erneut versuchen','error');return false;}
  const confirmed=await verifyCentral(test);
  if(!confirmed){showSyncStatus('⚠️ Speicherung konnte nicht bestätigt werden','error');return false;}
  centralSignature=appDataSignature(confirmed);
  showSyncStatus('✅ Erfolgreich gespeichert','ok');
  return true;
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const snapshot=appDataSignature(data);
    showSyncStatus('⏳ Wird gespeichert …','saving',true);
    const ok=await pushAppDataToSheet();
    if(!ok){showSyncStatus('⚠️ Nicht gespeichert – bitte erneut versuchen','error');return;}
    const confirmed=await verifyCentral(central=>appDataSignature(central)===snapshot);
    if(confirmed){
      centralSignature=appDataSignature(confirmed);
      showSyncStatus('✅ Erfolgreich gespeichert','ok');
      if(!editingActive())syncFromSheet().then(render);
    }else{

function appDataSignature(value){
  try{
    return JSON.stringify(value||{});
  }catch(e){
    return '';
  }
}

function fetchCentralAppData(){
  return new Promise((resolve)=>{
    const cb='sheetCheck_'+Date.now()+Math.random().toString(36).slice(2);
    let finished=false;

    window[cb]=res=>{
      finished=true;
      delete window[cb];
      resolve(res&&res.appData?res.appData:null);
    };

    const script=document.createElement('script');
    script.src=SHEET_URL+'?callback='+cb+'&check='+(Date.now());
    script.onerror=()=>{
      if(!finished){
        delete window[cb];
        resolve(null);
      }
    };

    document.body.appendChild(script);

    setTimeout(()=>{
      if(!finished){
        delete window[cb];
        resolve(null);
      }
    },5000);
  });
}

async function pushAppDataToSheet(){
  try{
    const central=await fetchCentralAppData();

    if(
      central &&
      centralSignature &&
      appDataSignature(central)!==centralSignature
    ){
      alert(
        'Die Daten wurden inzwischen auf einem anderen Gerät geändert. '+
        'Die App lädt jetzt den aktuellen Stand. Bitte führe deine letzte Änderung danach erneut aus.'
      );

      await syncFromSheet();
      return false;
    }

    await fetch(SHEET_URL,{
      method:'POST',
      mode:'no-cors',
      cache:'no-store',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify({
        action:'saveAppData',
        appData:data
      })
    });

    centralSignature=appDataSignature(data);
    return true;

  }catch(e){
    console.log('AppData Sync Fehler',e);
    alert('Die Daten konnten nicht an Google Sheets übertragen werden.');
    return false;
  }

async function saveTraining(){
  let c=calc(cur),it={id:id(),planKey:cur.planKey||'',date:cur.date,groupId:cur.groupId,groupName:c.gr.name,start:cur.start,end:cur.end,budget:c.budget,payout:c.total,trainers:c.rows};

    let oldId=data.plan[cur.planKey].trainingId;
    data.trainings=data.trainings.filter(t=>t.id!=oldId);
  }

  data.trainings.push(it);

  if(cur.planKey){
    data.plan[cur.planKey]={status:'filled',trainingId:it.id};
  }

    Array.isArray(central.trainings) && central.trainings.some(t=>String(t.id)===String(it.id))

function normalizeSchedule(s){
  if(!s.seriesId)s.seriesId=s.id;
  if(!s.validFrom || s.validFrom==='1900-01-01')s.validFrom=s.createdAt||'2026-04-01';
  let gr=g(s.groupId);
  if(gr){
    if(s.duration===undefined || s.duration===null || s.duration==='')s.duration=gr.duration;
    if(s.budget===undefined || s.budget===null || s.budget==='')s.budget=gr.budget;
    if(s.mainFee===undefined || s.mainFee===null || s.mainFee==='')s.mainFee=gr.mainFee;
    if(s.assistantFee===undefined || s.assistantFee===null || s.assistantFee==='')s.assistantFee=gr.assistantFee;
  }

function activeTrainings(){
  let activeIds=new Set(Object.values(data.plan||{}).map(p=>p&&p.trainingId).filter(Boolean));
  return data.trainings.filter(t=>activeIds.has(t.id));
}
function paidKey(name,y,qq){return y+'_Q'+qq+'_'+name}function isPaid(name,y,qq){return !!data.paidQ[paidKey(name,y,qq)]}function setPaid(name,y,qq,v){if(v)data.paidQ[paidKey(name,y,qq)]=1;else delete data.paidQ[paidKey(name,y,qq)]}function amount(name,y,qq){let s=0;activeTrainings().forEach(t=>{if(yr(t.date)==y&&q(t.date)==qq)t.trainers.forEach(r=>{if(r.name==name)s+=r.total})});return s}
function summary(){H('Auswertung');let y=new Date().getFullYear(),tot=0,paid=0;activeTrainings().forEach(t=>{if(yr(t.date)==y)t.trainers.forEach(r=>{tot+=r.total;if(isPaid(r.name,y,q(t.date)))paid+=r.total})});A().appendChild(div('sec','Jahresübersicht '+y));A().appendChild(div('card','<div class="inv"><div><span>Gesamt</span><b>'+eur(tot)+'</b></div><div><span>Bezahlt</span><b>'+eur(paid)+'</b></div><div><span>Offen</span><b>'+eur(tot-paid)+'</b></div></div>'));A().appendChild(div('sec','Quartale gesamt'));[1,2,3,4].forEach(qq=>quarterAll(y,qq));A().appendChild(div('sec','Trainer im Jahr'));let names=[...new Set(activeTrainings().flatMap(t=>t.trainers.map(r=>r.name)))];names.forEach(n=>trainerSummary(n,y))}
function quarterAll(y,qq){let names={},tot=0,paid=0;activeTrainings().forEach(t=>{if(yr(t.date)==y&&q(t.date)==qq)t.trainers.forEach(r=>{names[r.name]=1;tot+=r.total;if(isPaid(r.name,y,qq))paid+=r.total})});let all=Object.keys(names).length&&Object.keys(names).every(n=>isPaid(n,y,qq));A().appendChild(div('card '+(all?'paid':''),'<div class="row"><div class="title">Q'+qq+'</div><span class="badge '+(all?'green':'orange')+'">'+(all?'gesamt bezahlt':'offen')+'</span></div><div class="inv"><div><span>Gesamt</span><b>'+eur(tot)+'</b></div><div><span>Bezahlt</span><b>'+eur(paid)+'</b></div><div><span>Offen</span><b>'+eur(tot-paid)+'</b></div></div>'))}
function trainerSummary(n,y){let tot=0,paid=0,c=0;activeTrainings().forEach(t=>{if(yr(t.date)==y)t.trainers.forEach(r=>{if(r.name==n){tot+=r.total;c++;if(isPaid(n,y,q(t.date)))paid+=r.total}})});let box=div('item','<div class="row"><div><div class="title">'+n+'</div><div class="muted">'+c+' Einsätze</div></div><span class="badge blue">Details & Bezahlstatus</span></div><div class="inv"><div><span>Jahr gesamt</span><b>'+eur(tot)+'</b></div><div><span>Bezahlt</span><b>'+eur(paid)+'</b></div><div><span>Offen</span><b>'+eur(tot-paid)+'</b></div></div>');box.onclick=()=>{openSum=openSum==n?null:n;render()};A().appendChild(box);if(openSum==n)[1,2,3,4].forEach(qq=>{let total=amount(n,y,qq),p=isPaid(n,y,qq);A().appendChild(div('card '+(p?'paid':''),'<div class="row"><div class="title">Q'+qq+'</div><span class="badge '+(p?'green':'orange')+'">'+(p?'bezahlt':'offen')+'</span></div><div class="inv"><div><span>Gesamt</span><b>'+eur(total)+'</b></div><div><span>Bezahlt</span><b>'+eur(p?total:0)+'</b></div><div><span>Offen</span><b>'+eur(p?0:total)+'</b></div></div>'));A().appendChild(btn(p?'Q'+qq+' wieder offen markieren':'Q'+qq+' als bezahlt markieren',p?'secbtn':'ok',()=>{setPaid(n,y,qq,!p);save();render()}))})}
function list(){
  H('Datenliste');

  const listed=activeTrainings()
    .slice()
    .sort((a,b)=>
      String(b.date||'').localeCompare(String(a.date||'')) ||
      String(b.start||'').localeCompare(String(a.start||''))
    );

  if(!listed.length){
    A().appendChild(
      div('card muted','Noch keine Abrechnungen.')
    );
    return;
  }

  listed.forEach(training=>{
    const trainerBadges=(training.trainers||[])
      .map(trainer=>
        '<span class="badge blue">'+
        trainer.name+': '+eur(trainer.total)+
        '</span>'
      )
      .join(' ');

    const card=div(
      'card',
      '<div class="row">'+
        '<div>'+
          '<div class="title">'+training.groupName+'</div>'+
          '<div class="muted">'+
            training.date+' · '+training.start+
            (training.end?'–'+training.end:'')+
          '</div>'+
        '</div>'+
        '<b class="money">'+eur(training.payout)+'</b>'+
      '</div>'+
      '<div style="margin-top:10px">'+trainerBadges+'</div>'
    );

    const actions=div('grid g2');

    actions.appendChild(
      btn('Im Kalender öffnen','secbtn',()=>{
        mon=String(training.date).slice(0,7);
        sel=training.date;
        go('planning');
      })
    );

    actions.appendChild(
      btn('Training löschen','bad',async()=>{
        if(!confirm(
          'Dieses eingetragene Training wirklich löschen? '+
          'Die Beträge werden auch aus der Abrechnung und aus Google Sheets entfernt.'
        )){
          return;
        }

        data.trainings=data.trainings.filter(
          item=>String(item.id)!==String(training.id)
        );

        Object.keys(data.plan||{}).forEach(key=>{
          const entry=data.plan[key];

          if(
            entry &&
            String(entry.trainingId||'')===String(training.id)
          ){
            data.plan[key]={status:'open'};
          }
        });

        clearTimeout(saveTimer);
        const ok=await pushAppDataToSheet();

        if(ok){
          await new Promise(resolve=>setTimeout(resolve,1200));
          await syncFromSheet();
        }

        render();
      })
    );

    card.appendChild(actions);
    A().appendChild(card);
  });
}

function cleanText(x){return String(x||'').trim().toLowerCase().replace(/[^a-z0-9äöüß]/g,'')}
function cleanTime(x){return String(x||'').trim().replace(' ', '')}
function findPlanKeyForTraining(t){
  if(t.planKey)return t.planKey;
  if(!t.date)return '';

  let schedules=activeSchedulesForDate(t.date);

  let exact=schedules.filter(s=>{
    let gr=g(s.groupId);
    return gr && cleanText(gr.name)==cleanText(t.groupName) && cleanTime(s.start)==cleanTime(t.start) && cleanTime(s.end)==cleanTime(t.end);
  });

  if(exact.length){
    return (exact[0].seriesId||exact[0].id)+'_'+t.date;
  }

  let byName=schedules.filter(s=>{
    let gr=g(s.groupId);
    return gr && cleanText(gr.name)==cleanText(t.groupName);
  });

  if(byName.length){
    return (byName[0].seriesId||byName[0].id)+'_'+t.date;
  }

  return '';
}

function syncFromSheet(){
  return new Promise((resolve)=>{
    let cb='sheetSync_'+Date.now()+Math.random().toString(36).slice(2);
    let done=false;

    window[cb]=function(res){
      done=true;
      try{
        if(res && res.appData){
          data=Object.assign(JSON.parse(JSON.stringify(base)),res.appData);
          data.trainers=data.trainers||[];
          data.groups=data.groups||[];
          data.schedules=(data.schedules||[]).map(normalizeSchedule);
          data.plan=data.plan||{};
          data.one=data.one||[];
          data.trainings=data.trainings||[];
          data.paidQ=data.paidQ||{};
          centralSignature=appDataSignature(res.appData);

          // Zentrale, eindeutige Zuordnung für die Monatsübersicht.
          data.trainings.forEach(training=>{
            if(
              training &&
              training.id &&
              training.planKey &&
              Array.isArray(training.trainers) &&
              training.trainers.length
            ){
              data.plan[training.planKey]={
                status:'filled',
                trainingId:training.id
              };
            }
          });

          // Verwaiste Verknüpfungen entfernen.
          Object.keys(data.plan).forEach(key=>{
            const entry=data.plan[key];

            if(
              entry &&
              entry.trainingId &&
              !data.trainings.some(
                training=>String(training.id)===String(entry.trainingId)
              )
            ){
              data.plan[key]={status:'open'};
            }
          });

        }else{
          console.warn('Keine zentrale AppData gefunden. Lokaler Stand bleibt nur als Notfall-Cache aktiv.');
        }
      }catch(e){
        console.log('Sync Fehler',e);
      }

      delete window[cb];
      resolve();
    };

    let s=document.createElement('script');
    s.src=SHEET_URL+'?callback='+cb+'&_='+(Date.now());
    s.onerror=()=>{if(!done){delete window[cb];resolve();}};
    document.body.appendChild(s);
    setTimeout(()=>{if(!done){delete window[cb];resolve();}},4000);
  });
}

function runTestsSafe(){

    console.assert(weekdayOptions(2).includes('selected'),'Test: weekday selected');

    let c=calc(test);
    console.assert(Math.round(c.budget)===40,'Test: budget 40');

}
